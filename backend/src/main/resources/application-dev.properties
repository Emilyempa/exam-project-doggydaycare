# Server (dev)
server.port=8080

spring.threads.virtual.enabled=true

# Database (dev)
spring.datasource.url=jdbc:mysql://localhost:3306/doggydaycare?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate (dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security (dev - basic for testing)
spring.security.user.name=admin
spring.security.user.password=admin123

# Dev Logging
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.boot.model.process=DEBUG
logging.level.org.hibernate.tool.schema=TRACE

# JWT Configuration for OAuth2 Resource Server
jwt.secret=${JWT_SECRET:this-is-only-a-placeholder-secret-do-not-trust-it-11223344}
jwt.expiration=86400000

# env
spring.config.import=optional:file:.env[.properties]
