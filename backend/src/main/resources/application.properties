# Server Configuration
server.port=8080

spring.threads.virtual.enabled=true

# Database Configuration
# Tip: IntelliJ/DataGrip JDBC URL example (local):
# jdbc:mysql://localhost:3306/doggydaycare?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.url=jdbc:mysql://mysql:3306/doggydaycare?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
# TODO fix .env file or other saver alternative spring cloud config
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
#TODO set to none when ready to deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security (for now, disable CSRF for testing)
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration for OAuth2 Resource Server
jwt.secret=${JWT_SECRET:this-is-only-a-placeholder-secret-do-not-trust-it-11223344}
jwt.expiration=86400000

# env
spring.config.import=optional:file:.env[.properties]

